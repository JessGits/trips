<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trips · Coming Soon</title>
  <style>
    :root {
      --navy: #1B3A5C;
      --gold: #C9A961;
      --cream: #FAF7F0;
      --slate: #4A5568;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--cream);
      color: var(--slate);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      max-width: 480px;
      text-align: center;
      background: white;
      border: 1px solid rgba(27, 58, 92, 0.1);
      border-radius: 12px;
      padding: 48px 32px;
      box-shadow: 0 4px 24px rgba(27, 58, 92, 0.06);
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
    }
    h1 {
      font-size: 32px;
      color: var(--navy);
      margin-bottom: 12px;
      font-weight: 700;
    }
    p {
      font-size: 15px;
      color: var(--slate);
      margin-bottom: 8px;
    }
    .footer {
      margin-top: 32px;
      font-size: 11px;
      color: rgba(27, 58, 92, 0.4);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Test Page · Plumbing Check</div>
    <h1>It works.</h1>
    <p>If you're reading this, the pipeline is live:</p>
    <p>Local Mac → GitHub Desktop → GitHub.com → live URL.</p>
    <div class="footer">Trips · Built by Jess</div>
  </div>
</body>
</html>
